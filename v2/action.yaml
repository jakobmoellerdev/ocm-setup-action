name: "Open Component Model v2 command line (ocm) installer"
description: "Install the ocm v2 CLI from https://github.com/open-component-model/open-component-model/releases. Accepts latest or a version like 0.23.0."
inputs:
  version:
    description: "Version of the ocm CLI to install, either latest or a version such as 0.23.0 or v0.23.0"
    required: false
    default: latest
  repo:
    description: "Repository hosting the ocm CLI releases"
    required: false
    default: "open-component-model/open-component-model"
  verify-attestation:
    description: "Verify the GitHub build provenance attestation of the binary with gh attestation verify (requires the gh CLI on the runner)"
    required: false
    default: "true"
  token:
    description: "GitHub token used for release lookups and attestation verification"
    required: false
    default: ${{ github.token }}
outputs:
  version:
    description: "Installed release tag, e.g. v0.23.0"
    value: ${{ steps.install.outputs.version }}
  path:
    description: "Absolute path of the installed ocm binary"
    value: ${{ steps.install.outputs.path }}
branding:
  color: "blue"
runs:
  using: "composite"
  steps:
    - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      id: install
      env:
        OCM_VERSION: ${{ inputs.version }}
        OCM_REPO: ${{ inputs.repo }}
        OCM_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        OCM_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const install = require(require('node:path').join(process.env.ACTION_PATH, 'install.js'));
          await install({ github, core, exec });

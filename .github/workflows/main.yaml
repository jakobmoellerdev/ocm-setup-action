name: main-test
permissions:
  contents: read
  pull-requests: read
"on": [push]

jobs:
  test_job:
    runs-on: ubuntu-latest
    name: A test job
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup ocm
      id: setup
      uses: ./
#      with:
#        version: v0.19.0
    - name: Output
      run: |
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        which ocm
        ocm --version

  test_v2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        version: [latest, 0.23.0]
    runs-on: ${{ matrix.os }}
    name: v2 (${{ matrix.os }}, ${{ matrix.version }})
    permissions:
      contents: read
      attestations: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup ocm v2
      id: setup
      uses: ./v2
      with:
        version: ${{ matrix.version }}
        verify-attestation: "true"
    - name: Output
      shell: bash
      run: |
        echo "installed ${{ steps.setup.outputs.version }} at ${{ steps.setup.outputs.path }}"
        ocm version
        if [ "${{ matrix.version }}" != latest ]; then
          ocm version | grep -F "Version:  ${{ matrix.version }}"
        fi
